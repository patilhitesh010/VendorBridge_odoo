<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Profile - VendorBridge</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>VendorBridge</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard">Dashboard</a>
                <a href="/products">Products</a>
                <a href="/orders">Orders</a>
                <a href="/profile" class="active">Profile</a>
                <a href="/auth/logout" class="logout-link">Logout</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="content-header">
                <h1>Vendor Profile</h1>
            </header>
            
            <div id="message" class="alert hidden"></div>

            <div class="profile-container">
                <form action="/profile/update" method="POST" class="profile-form">
                    <div class="form-group">
                        <label for="vendor_name">Vendor Contact Name</label>
                        <input type="text" id="vendor_name" name="vendor_name" required>
                    </div>
                    <div class="form-group">
                        <label for="company_name">Company Name</label>
                        <input type="text" id="company_name" name="company_name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address (Cannot be changed)</label>
                        <input type="email" id="email" disabled>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Company Address</label>
                        <textarea id="address" name="address" required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Update Profile</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/profile/data')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('vendor_name').value = data.vendor_name;
                    document.getElementById('company_name').value = data.company_name;
                    document.getElementById('email').value = data.email;
                    document.getElementById('phone').value = data.phone;
                    document.getElementById('address').value = data.address;
                });

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('updated')) {
                const msg = document.getElementById('message');
                msg.textContent = 'Profile updated successfully!';
                msg.classList.remove('hidden');
                msg.classList.add('alert-success');
            }
        });
    </script>
</body>
</html>
