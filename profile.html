<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorBridge - Profile</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="navbar-brand">
                <h1>VendorBridge</h1>
            </div>
            <ul class="navbar-menu">
                <li><a href="/dashboard">Dashboard</a></li>
                <li><a href="/products">Products</a></li>
                <li><a href="/orders">Orders</a></li>
                <li><a href="/profile" class="active">Profile</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>

        <div class="content">
            <h2>Vendor Profile</h2>

            <form id="profileForm" class="profile-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone">
                    </div>
                </div>

                <div class="form-group">
                    <label for="company_name">Company Name</label>
                    <input type="text" id="company_name" required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city">
                    </div>
                    
                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" id="state">
                    </div>
                    
                    <div class="form-group">
                        <label for="pincode">Pincode</label>
                        <input type="text" id="pincode">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email (Read-only)</label>
                    <input type="email" id="email" readonly>
                </div>

                <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                const response = await fetch('/api/profile');
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                if (response.ok) {
                    const vendor = await response.json();
                    document.getElementById('name').value = vendor.name;
                    document.getElementById('phone').value = vendor.phone || '';
                    document.getElementById('company_name').value = vendor.company_name;
                    document.getElementById('address').value = vendor.address || '';
                    document.getElementById('city').value = vendor.city || '';
                    document.getElementById('state').value = vendor.state || '';
                    document.getElementById('pincode').value = vendor.pincode || '';
                    document.getElementById('email').value = vendor.email;
                }
            } catch (error) {
                showMessage('Error loading profile', 'error');
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const profileData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                company_name: document.getElementById('company_name').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                pincode: document.getElementById('pincode').value
            };

            try {
                const response = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profileData)
                });

                if (response.ok) {
                    showMessage('Profile updated successfully', 'success');
                } else {
                    showMessage('Failed to update profile', 'error');
                }
            } catch (error) {
                showMessage('Error updating profile', 'error');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await fetch('/auth/logout');
                window.location.href = '/login';
            } catch (error) {
                console.error('Error logging out:', error);
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            setTimeout(() => messageDiv.textContent = '', 3000);
        }

        loadProfile();
    </script>
</body>
</html>
