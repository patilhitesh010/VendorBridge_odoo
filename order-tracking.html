<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - VendorBridge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 900px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px 10px 0 0;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .form-section {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .status-section {
            padding: 30px;
            border-top: 1px solid #eee;
            display: none;
        }

        .status-section.show {
            display: block;
        }

        .order-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .order-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 15px;
            background: white;
            border-radius: 5px;
            border: 1px solid #eee;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-badge.shipped {
            background: #cfe2ff;
            color: #084298;
        }

        .status-badge.delivered {
            background: #d1e7dd;
            color: #0f5132;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .items-table th {
            background: #f0f0f0;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        .items-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .items-table tr:hover {
            background: #f9f9f9;
        }

        .total-row {
            background: #f0f0f0;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            box-shadow: 0 5px 20px rgba(108, 117, 125, 0.4);
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .success.show {
            display: block;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .order-info {
                grid-template-columns: 1fr;
            }

            .items-table {
                font-size: 12px;
            }

            .items-table th, .items-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Track Your Order</h1>
            <p>Enter your Order ID and Email to see the status</p>
        </div>

        <div class="form-section">
            <div class="error" id="error"></div>
            <div class="success" id="success"></div>

            <form id="trackForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="orderId">Order ID *</label>
                        <input type="text" id="orderId" placeholder="e.g., 1" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" placeholder="e.g., john@example.com" required>
                    </div>
                </div>
                <button type="submit">Track Order</button>
            </form>
        </div>

        <div class="status-section" id="statusSection">
            <h2 style="margin-bottom: 20px;">Order Status</h2>

            <div class="order-card">
                <div class="order-info">
                    <div class="info-item">
                        <div class="info-label">Order Number</div>
                        <div class="info-value" id="orderNum">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Order Date</div>
                        <div class="info-value" id="orderDate">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Status</div>
                        <div class="info-value">
                            <span class="status-badge" id="statusBadge">-</span>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Total Amount</div>
                        <div class="info-value" id="totalAmount">-</div>
                    </div>
                </div>

                <div class="order-info">
                    <div class="info-item">
                        <div class="info-label">Vendor</div>
                        <div class="info-value" id="vendorName">-</div>
                        <div style="font-size: 12px; color: #999; margin-top: 5px;" id="vendorCompany">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Delivery Address</div>
                        <div class="info-value" style="font-size: 14px;" id="deliveryAddress">-</div>
                    </div>
                </div>

                <table class="items-table">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody">
                    </tbody>
                    <tfoot>
                        <tr class="total-row">
                            <td colspan="4" style="text-align: right;">Total:</td>
                            <td id="finalTotal">₹0.00</td>
                        </tr>
                    </tfoot>
                </table>

                <div class="action-buttons">
                    <button class="btn-secondary" onclick="printInvoice()">🖨️ Print Invoice</button>
                    <button class="btn-secondary" onclick="downloadInvoice()">📄 View Invoice</button>
                    <button class="btn-secondary" onclick="resetForm()">← New Search</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentOrderData = null;

        document.getElementById('trackForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const orderId = document.getElementById('orderId').value;
            const email = document.getElementById('email').value;

            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');

            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            try {
                const response = await fetch(`/api/buyer/order-status/${orderId}?email=${encodeURIComponent(email)}`);
                
                if (!response.ok) {
                    throw new Error('Order not found');
                }

                const data = await response.json();
                currentOrderData = data;
                displayOrderStatus(data);
                successDiv.textContent = '✓ Order found successfully!';
                successDiv.classList.add('show');
                document.getElementById('statusSection').classList.add('show');

            } catch (error) {
                errorDiv.textContent = '❌ ' + error.message;
                errorDiv.classList.add('show');
                document.getElementById('statusSection').classList.remove('show');
            }
        });

        function displayOrderStatus(data) {
            const { order, vendor, items } = data;

            document.getElementById('orderNum').textContent = `#${order.id}`;
            document.getElementById('orderDate').textContent = new Date(order.created_at).toLocaleDateString('en-IN');
            document.getElementById('statusBadge').textContent = order.status.toUpperCase();
            document.getElementById('statusBadge').className = `status-badge ${order.status}`;
            document.getElementById('totalAmount').textContent = `₹${order.total_amount.toFixed(2)}`;
            document.getElementById('vendorName').textContent = vendor.name;
            document.getElementById('vendorCompany').textContent = vendor.company_name;
            document.getElementById('deliveryAddress').textContent = order.delivery_address;

            const itemsBody = document.getElementById('itemsBody');
            itemsBody.innerHTML = '';

            items.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.category || '-'}</td>
                    <td>${item.quantity}</td>
                    <td>₹${item.price.toFixed(2)}</td>
                    <td>₹${(item.price * item.quantity).toFixed(2)}</td>
                `;
                itemsBody.appendChild(row);
            });

            document.getElementById('finalTotal').textContent = `₹${order.total_amount.toFixed(2)}`;
        }

        function printInvoice() {
            if (!currentOrderData) return;
            window.open(`/invoice?orderId=${currentOrderData.order.id}&email=${encodeURIComponent(currentOrderData.order.buyer_email)}`, '_blank');
        }

        function downloadInvoice() {
            if (!currentOrderData) return;
            window.open(`/invoice?orderId=${currentOrderData.order.id}&email=${encodeURIComponent(currentOrderData.order.buyer_email)}&print=true`, '_blank');
        }

        function resetForm() {
            document.getElementById('trackForm').reset();
            document.getElementById('statusSection').classList.remove('show');
            document.getElementById('error').classList.remove('show');
            document.getElementById('success').classList.remove('show');
            currentOrderData = null;
        }
    </script>
</body>
</html>
