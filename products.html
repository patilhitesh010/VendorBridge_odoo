<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorBridge - Products</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="navbar-brand">
                <h1>VendorBridge</h1>
            </div>
            <ul class="navbar-menu">
                <li><a href="/dashboard">Dashboard</a></li>
                <li><a href="/products" class="active">Products</a></li>
                <li><a href="/orders">Orders</a></li>
                <li><a href="/profile">Profile</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </nav>

        <div class="content">
            <div class="page-header">
                <h2>My Products</h2>
                <button class="btn btn-primary" id="addProductBtn">Add New Product</button>
            </div>

            <div id="productModal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modalTitle">Add Product</h3>
                        <button class="close-btn" id="closeModal">&times;</button>
                    </div>
                    
                    <form id="productForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="productName">Product Name</label>
                                <input type="text" id="productName" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="category">Category</label>
                                <input type="text" id="category" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" rows="3"></textarea>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="price">Price</label>
                                <input type="number" id="price" step="0.01" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="quantity">Quantity</label>
                                <input type="number" id="quantity" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="imageUrl">Image URL</label>
                            <input type="url" id="imageUrl">
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Save Product</button>
                    </form>
                </div>
            </div>

            <div id="productsList" class="products-table">
                <div class="loading">Loading products...</div>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        let editingProductId = null;

        const modal = document.getElementById('productModal');
        const addProductBtn = document.getElementById('addProductBtn');
        const closeModal = document.getElementById('closeModal');
        const productForm = document.getElementById('productForm');
        const productsList = document.getElementById('productsList');

        addProductBtn.addEventListener('click', () => {
            editingProductId = null;
            document.getElementById('modalTitle').textContent = 'Add Product';
            productForm.reset();
            modal.classList.remove('hidden');
        });

        closeModal.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const productData = {
                name: document.getElementById('productName').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                quantity: parseInt(document.getElementById('quantity').value),
                image_url: document.getElementById('imageUrl').value
            };

            try {
                const url = editingProductId ? `/api/products/${editingProductId}` : '/api/products';
                const method = editingProductId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });

                if (response.ok) {
                    modal.classList.add('hidden');
                    loadProducts();
                    showMessage('Product saved successfully', 'success');
                } else {
                    showMessage('Failed to save product', 'error');
                }
            } catch (error) {
                showMessage('Error saving product', 'error');
            }
        });

        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const products = await response.json();
                
                if (products.length === 0) {
                    productsList.innerHTML = '<p class="empty">No products added yet.</p>';
                    return;
                }

                let html = '<table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Quantity</th><th>Actions</th></tr></thead><tbody>';
                products.forEach(product => {
                    html += `<tr>
                        <td>${product.name}</td>
                        <td>${product.category}</td>
                        <td>₹${product.price}</td>
                        <td>${product.quantity}</td>
                        <td>
                            <button class="btn btn-sm btn-edit" onclick="editProduct(${product.id})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${product.id})">Delete</button>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                productsList.innerHTML = html;
            } catch (error) {
                productsList.innerHTML = '<p class="error">Error loading products</p>';
            }
        }

        async function editProduct(productId) {
            try {
                const response = await fetch(`/api/products/${productId}`);
                const product = await response.json();

                editingProductId = productId;
                document.getElementById('modalTitle').textContent = 'Edit Product';
                document.getElementById('productName').value = product.name;
                document.getElementById('category').value = product.category;
                document.getElementById('description').value = product.description;
                document.getElementById('price').value = product.price;
                document.getElementById('quantity').value = product.quantity;
                document.getElementById('imageUrl').value = product.image_url || '';
                modal.classList.remove('hidden');
            } catch (error) {
                showMessage('Error loading product', 'error');
            }
        }

        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const response = await fetch(`/api/products/${productId}`, { method: 'DELETE' });
                if (response.ok) {
                    loadProducts();
                    showMessage('Product deleted successfully', 'success');
                } else {
                    showMessage('Failed to delete product', 'error');
                }
            } catch (error) {
                showMessage('Error deleting product', 'error');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            setTimeout(() => messageDiv.textContent = '', 3000);
        }

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await fetch('/auth/logout');
                window.location.href = '/login';
            } catch (error) {
                console.error('Error logging out:', error);
            }
        });

        loadProducts();
    </script>
</body>
</html>
